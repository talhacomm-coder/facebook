<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنڌي نيوز پوسٽ جنريٽر - پرو ورشن</title>
    <!-- Bootstrap 5 CSS RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css.rtl.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lateef&family=Noto+Nastaliq+Urdu:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Cairo', sans-serif;
        }
        .preview-container {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 4 / 5;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin: 0 auto;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }
        /* Dynamic Templates Styling */
        .template-1 .preview-header-banner {
            background: #cc0000;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 8px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .template-1 .preview-image-box {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
            border: 8px solid #cc0000;
            border-top: none;
            border-bottom: none;
        }
        .template-1 .news-text-box {
            background-color: #0d6efd;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        /* Template 2 (Modern News Frame Style) */
        .template-2 .preview-header-banner {
            background: linear-gradient(90deg, #ffc107, #fd7e14);
            color: #000;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            font-size: 1.3rem;
        }
        .template-2 .preview-image-box {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
        }
        .template-2 .news-text-box {
            background-color: #212529;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .watermark-logo {
            position: absolute;
            top: 15px;
            left: 15px;
            border-radius: 50%;
            border: 2px solid white;
            background: white;
            object-fit: cover;
            z-index: 5;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa fa-newspaper me-2"></i> سنڌي نيوز پوسٽ جنريٽر</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <!-- Controls / Admin Panel -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm p-4 border-0">
                    <h3 class="mb-3 text-primary"><i class="fa fa-sliders me-2"></i> ايڊمن پينل ۽ ڊزائن سيٽنگون</h3>
                    
                    <!-- Template Selector -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">پوسٽ جو ڊزائن ٽيمپليٽ چونڊيو</label>
                        <select class="form-select" id="templateSelector">
                            <option value="template-1">ڊزائن 1 (ڪلاسيڪل بريڪنگ نيوز فريم)</option>
                            <option value="template-2">ڊزائن 2 (ماڊرن گريڊيئنٽ انداز)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">لوگو اپلوڊ ڪريو</label>
                        <input type="file" class="form-control" id="logoInput" accept="image/*">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">لوگو جي سائيز: <span id="logoSizeVal">80</span>px</label>
                            <input type="range" class="form-range" id="logoSizeRange" min="40" max="150" value="80">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">لوگو جي پوزيشن</label>
                            <select class="form-select" id="logoPositionSelector">
                                <option value="top-left">مٿي کاٻي پاسي</option>
                                <option value="top-right">مٿي سڄي پاسي</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">مکيه تصوير اپلوڊ ڪريو</label>
                        <input type="file" class="form-control" id="mainImageInput" accept="image/*">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">برڪنگ نيوز جو عنوان</label>
                            <input type="text" class="form-control" id="breakingTitleInput" value="برڪنگ نيوز">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">مٿين پٽي جو رنگ</label>
                            <input type="color" class="form-control form-control-color w-100" id="topBannerColor" value="#cc0000">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">خبر جو متن (Text)</label>
                        <textarea class="form-control" id="newsTextInput" rows="3">رائونتي ۾ موٽر سائڪل سوارن تي مبينه درون حملو، نصير ڪورائي ۽ الله ڏتو ڪورائي زخمي</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">فونٽ سائيز: <span id="fontSizeVal">20</span>px</label>
                            <input type="range" class="form-range" id="fontSizeRange" min="14" max="36" value="20">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">پٽي اوچائي: <span id="barHeightVal">120</span>px</label>
                            <input type="range" class="form-range" id="barHeightRange" min="80" max="250" value="120">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">هيٺين پٽي جو رنگ</label>
                            <input type="color" class="form-control form-control-color w-100" id="bottomBarColor" value="#0d6efd">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">فونٽ جي چونڊ</label>
                        <select class="form-select" id="fontSelector">
                            <option value="'Noto Nastaliq Urdu', serif" selected>Noto Nastaliq (نستعليق)</option>
                            <option value="'Lateef', cursive">Lateef (سنڌي روايتي)</option>
                            <option value="'Amiri', serif">Amiri (قاعدو)</option>
                            <option value="'Cairo', sans-serif">Cairo (عام)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">سماجي رابطن جا آئڪن چونڊيو</label>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-facebook" id="chk-fb" checked><label class="form-check-label" for="chk-fb">فيس بوڪ</label></div>
                            <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-instagram" id="chk-insta" checked><label class="form-check-label" for="chk-insta">انسٽाग्राम</label></div>
                            <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-whatsapp" id="chk-wa" checked><label class="form-check-label" for="chk-wa">واٽس اپ</label></div>
                            <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-tiktok" id="chk-tt"><label class="form-check-label" for="chk-tt">ٽڪ تاڪ</label></div>
                        </div>
                    </div>

                    <button class="btn btn-success w-100 py-2 fw-bold shadow" id="downloadBtn"><i class="fa fa-download me-2"></i> تصوير ڊائونلوڊ ڪريو</button>
                </div>
            </div>

            <!-- Live Preview -->
            <div class="col-lg-6">
                <h4 class="text-center mb-3 text-secondary">لائيو پريوو (Live Preview)</h4>
                <div class="preview-container template-1" id="captureArea">
                    <img id="prevLogo" src="https://via.placeholder.com/80" class="watermark-logo" style="width: 80px; height: 80px;">
                    <div class="preview-header-banner" id="prevTopBanner">برڪنگ نيوز</div>
                    <div class="preview-image-box" id="prevImageBox">
                        <img id="prevMainImage" src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80" class="preview-image">
                    </div>
                    <div class="news-text-box" id="prevNewsText" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 20px; height: 120px;">
                        رائونتي ۾ موٽر سائڪل سوارن تي مبينه درون حملو، نصير ڪورائي ۽ الله ڏتو ڪورائي زخمي
                    </div>
                    <div class="bg-dark text-white p-2 d-flex justify-content-center gap-3 align-items-center" id="prevSocialBar" style="height: 40px;">
                        <i class="fab fa-facebook fa-lg text-primary"></i>
                        <i class="fab fa-instagram fa-lg text-danger"></i>
                        <i class="fab fa-whatsapp fa-lg text-success"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Html2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const templateSelector = document.getElementById('templateSelector');
        const captureArea = document.getElementById('captureArea');
        const logoInput = document.getElementById('logoInput');
        const logoSizeRange = document.getElementById('logoSizeRange');
        const logoSizeVal = document.getElementById('logoSizeVal');
        const logoPositionSelector = document.getElementById('logoPositionSelector');
        const mainImageInput = document.getElementById('mainImageInput');
        const breakingTitleInput = document.getElementById('breakingTitleInput');
        const topBannerColor = document.getElementById('topBannerColor');
        const newsTextInput = document.getElementById('newsTextInput');
        const fontSelector = document.getElementById('fontSelector');
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const barHeightRange = document.getElementById('barHeightRange');
        const barHeightVal = document.getElementById('barHeightVal');
        const bottomBarColor = document.getElementById('bottomBarColor');
        
        const prevLogo = document.getElementById('prevLogo');
        const prevTopBanner = document.getElementById('prevTopBanner');
        const prevImageBox = document.getElementById('prevImageBox');
        const prevMainImage = document.getElementById('prevMainImage');
        const prevNewsText = document.getElementById('prevNewsText');
        const prevSocialBar = document.getElementById('prevSocialBar');
        const downloadBtn = document.getElementById('downloadBtn');

        // Template Switcher
        templateSelector.addEventListener('change', (e) => {
            captureArea.className = "preview-container " + e.target.value;
            if(e.target.value === 'template-1') {
                prevTopBanner.style.background = topBannerColor.value;
                prevImageBox.style.borderColor = topBannerColor.value;
                prevNewsText.style.background = bottomBarColor.value;
            } else {
                prevTopBanner.style.background = 'linear-gradient(90deg, #ffc107, #fd7e14)';
                prevNewsText.style.background = '#212529';
            }
        });

        topBannerColor.addEventListener('input', (e) => {
            prevTopBanner.style.background = e.target.value;
            if(templateSelector.value === 'template-1') {
                prevImageBox.style.borderColor = e.target.value;
            }
        });

        bottomBarColor.addEventListener('input', (e) => {
            prevNewsText.style.background = e.target.value;
        });

        logoSizeRange.addEventListener('input', (e) => {
            logoSizeVal.innerText = e.target.value;
            prevLogo.style.width = e.target.value + 'px';
            prevLogo.style.height = e.target.value + 'px';
        });

        logoPositionSelector.addEventListener('change', (e) => {
            if(e.target.value === 'top-left') {
                prevLogo.style.left = '15px';
                prevLogo.style.right = 'auto';
            } else {
                prevLogo.style.right = '15px';
                prevLogo.style.left = 'auto';
            }
        });

        fontSizeRange.addEventListener('input', (e) => {
            fontSizeVal.innerText = e.target.value;
            prevNewsText.style.fontSize = e.target.value + 'px';
        });

        barHeightRange.addEventListener('input', (e) => {
            barHeightVal.innerText = e.target.value;
            prevNewsText.style.height = e.target.value + 'px';
        });

        breakingTitleInput.addEventListener('input', (e) => {
            prevTopBanner.innerText = e.target.value;
        });

        logoInput.addEventListener('change', (e) => {
            if (e.target.files[0]) prevLogo.src = URL.createObjectURL(e.target.files[0]);
        });

        mainImageInput.addEventListener('change', (e) => {
            if (e.target.files[0]) prevMainImage.src = URL.createObjectURL(e.target.files[0]);
        });

        newsTextInput.addEventListener('input', (e) => {
            prevNewsText.innerText = e.target.value;
        });

        fontSelector.addEventListener('change', (e) => {
            prevNewsText.style.fontFamily = e.target.value;
        });

        document.querySelectorAll('.social-chk').forEach(chk => {
            chk.addEventListener('change', updateSocialIcons);
        });

        function updateSocialIcons() {
            prevSocialBar.innerHTML = '';
            if(document.getElementById('chk-fb').checked) prevSocialBar.innerHTML += '<i class="fab fa-facebook fa-lg text-primary"></i>';
            if(document.getElementById('chk-insta').checked) prevSocialBar.innerHTML += '<i class="fab fa-instagram fa-lg text-danger"></i>';
            if(document.getElementById('chk-wa').checked) prevSocialBar.innerHTML += '<i class="fab fa-whatsapp fa-lg text-success"></i>';
            if(document.getElementById('chk-tt').checked) prevSocialBar.innerHTML += '<i class="fab fa-tiktok fa-lg text-light"></i>';
        }

        downloadBtn.addEventListener('click', () => {
            downloadBtn.innerText = "ٽيمپليٽ تيار ٿي رهيو آهي...";
            downloadBtn.disabled = true;

            html2canvas(captureArea, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Sindhi-News-Post.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                setTimeout(() => {
                    downloadBtn.innerHTML = '<i class="fa fa-download me-2"></i> تصوير ڊائونلوڊ ڪريو';
                    downloadBtn.disabled = false;
                }, 1000);
            });
        });
    </script>
</body>
</html>
