<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنڌي نيوز پوسٽ جنريٽر - مڪمل ڪنٽرول ورشن</title>
    <!-- Bootstrap 5 CSS RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css.rtl.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lateef&family=Noto+Nastaliq+Urdu:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Cairo', sans-serif;
        }
        .preview-container {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 4 / 5;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            margin: 0 auto;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }
        .preview-header-banner {
            background: #cc0000;
            color: white;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 2;
        }
        .preview-image-box {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
            background: #111;
        }
        .preview-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform 0.05s ease;
        }
        .news-text-box {
            background-color: #0d6efd;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            flex-shrink: 0;
            z-index: 2;
        }
        .watermark-logo {
            position: absolute;
            top: 15px;
            left: 15px;
            border-radius: 50%;
            border: 2px solid white;
            background: white;
            object-fit: cover;
            z-index: 10;
        }
        .custom-name-watermark {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 10;
            white-space: nowrap;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .settings-card {
            max-height: 85vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm mb-3">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa fa-newspaper me-2"></i> سنڌي نيوز پوسٽليڪر</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-3">
            <!-- Live Preview Column -->
            <div class="col-lg-5">
                <div class="sticky-top" style="top: 20px;">
                    <div class="card shadow-sm p-3 border-0">
                        <h6 class="text-center mb-2 text-secondary fw-bold">لائيو پريوو فريم</h6>
                        
                        <div class="preview-container mb-3" id="captureArea">
                            <img id="prevLogo" src="https://via.placeholder.com/80" class="watermark-logo" style="width: 70px; height: 70px; top: 15px; left: 15px;">
                            <div id="prevCustomName" class="custom-name-watermark" style="font-size: 16px; bottom: 130px; right: 15px;">رپورٽر جو نالو</div>
                            <div class="preview-header-banner" id="prevTopBanner" style="font-size: 18px; height: 40px; background-color: #cc0000;">برڪنگ نيوز</div>
                            <div class="preview-image-box" id="prevImageBox">
                                <img id="prevMainImage" src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80" class="preview-image" style="transform: scale(1) translate(0px, 0px);">
                            </div>
                            <div class="news-text-box" id="prevNewsText" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 18px; height: 110px; background-color: #0d6efd;">
                                رائونتي ۾ موٽر سائڪل سوارن تي مبينه درون حملو، نصير ڪورائي ۽ الله ڏتو ڪورائي زخمي
                            </div>
                            <div class="bg-dark text-white p-1 d-flex justify-content-center gap-3 align-items-center" id="prevSocialBar" style="height: 35px; z-index: 2;">
                                <i class="fab fa-facebook text-primary"></i>
                                <i class="fab fa-instagram text-danger"></i>
                                <i class="fab fa-whatsapp text-success"></i>
                            </div>
                        </div>

                        <button class="btn btn-success w-100 py-2 fw-bold shadow-sm" id="downloadBtn"><i class="fa fa-download me-2"></i> تصوير ڊائونلوڊ ڪريو</button>
                    </div>
                </div>
            </div>

            <!-- Single Unified Settings Frame Column -->
            <div class="col-lg-7">
                <div class="card shadow-sm p-3 border-0 settings-card">
                    <h5 class="mb-3 text-primary border-bottom pb-2 fs-6 fw-bold"><i class="fa fa-sliders me-2"></i> سڀئي ڊزائن ۽ ايڊيٽنگ سيٽنگون</h5>
                    
                    <div class="accordion" id="settingsAccordion">

                        <!-- 1. Main Image Settings -->
                        <div class="accordion-item mb-2 border">
                            <h2 class="accordion-header" id="headingImage">
                                <button class="accordion-button py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseImage" aria-expanded="true" aria-controls="collapseImage">
                                    <i class="fa fa-image me-2 text-primary"></i> مکيه تصوير سيٽنگون (زوم، مٿي/هيٺ، کاٻي/سڄي)
                                </button>
                            </h2>
                            <div id="collapseImage" class="accordion-collapse collapse show" aria-labelledby="headingImage" data-bs-parent="#settingsAccordion">
                                <div class="accordion-body bg-light py-2">
                                    <div class="mb-2">
                                        <label class="form-label small mb-1">تصوير اپلوڊ ڪريو</label>
                                        <input type="file" class="form-control form-control-sm" id="mainImageInput" accept="image/*">
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label small mb-1">تصوير زوم (Zoom): <span id="imgScaleVal">1</span>x</label>
                                        <input type="range" class="form-range" id="imgScaleRange" min="1" max="3" step="0.1" value="1">
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label class="form-label small mb-1">کاٻي/سڄي (X): <span id="imgPosXVal">0</span>px</label>
                                            <input type="range" class="form-range" id="imgPosXRange" min="-150" max="150" value="0">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small mb-1">مٿي/هيٺ (Y): <span id="imgPosYVal">0</span>px</label>
                                            <input type="range" class="form-range" id="imgPosYRange" min="-150" max="150" value="0">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. Logo Settings -->
                        <div class="accordion-item mb-2 border">
                            <h2 class="accordion-header" id="headingLogo">
                                <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseLogo" aria-expanded="false" aria-controls="collapseLogo">
                                    <i class="fa fa-circle-user me-2 text-primary"></i> لوگو سيٽنگون (سائيز ۽ پوزيشن)
                                </button>
                            </h2>
                            <div id="collapseLogo" class="accordion-collapse collapse" aria-labelledby="headingLogo" data-bs-parent="#settingsAccordion">
                                <div class="accordion-body bg-light py-2">
                                    <div class="mb-2">
                                        <label class="form-label small mb-1">لوگو اپلوڊ ڪريو</label>
                                        <input type="file" class="form-control form-control-sm" id="logoInput" accept="image/*">
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-12 mb-1">
                                            <label class="form-label small mb-1">سائيز: <span id="logoSizeVal">70</span>px</label>
                                            <input type="range" class="form-range" id="logoSizeRange" min="30" max="120" value="70">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small mb-1">کاٻي/سڄي (X): <span id="logoPosXVal">15</span>px</label>
                                            <input type="range" class="form-range" id="logoPosXRange" min="0" max="300" value="15">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small mb-1">مٿي/هيٺ (Y): <span id="logoPosYVal">15</span>px</label>
                                            <input type="range" class="form-range" id="logoPosYRange" min="0" max="250" value="15">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 3. Custom Name / Reporter Name Settings -->
                        <div class="accordion-item mb-2 border">
                            <h2 class="accordion-header" id="headingCustomName">
                                <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCustomName" aria-expanded="false" aria-controls="collapseCustomName">
                                    <i class="fa fa-font me-2 text-primary"></i> نالو / واٽر مارڪ ٽيڪست سيٽنگون
                                </button>
                            </h2>
                            <div id="collapseCustomName" class="accordion-collapse collapse" aria-labelledby="headingCustomName" data-bs-parent="#settingsAccordion">
                                <div class="accordion-body bg-light py-2">
                                    <div class="mb-2">
                                        <label class="form-label small mb-1">پنهنجو نالو يا چينل جو نالو لکو</label>
                                        <input type="text" class="form-control form-control-sm" id="customNameInput" value="رپورٽر جو نالو">
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-12 mb-1">
                                            <label class="form-label small mb-1">فونٽ سائيز: <span id="customNameSizeVal">16</span>px</label>
                                            <input type="range" class="form-range" id="customNameSizeRange" min="10" max="30" value="16">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small mb-1">کاٻي/سڄي (سڄي پاسي کان فاصلي لاءِ): <span id="customNamePosXVal">15</span>px</label>
                                            <input type="range" class="form-range" id="customNamePosXRange" min="0" max="300" value="15">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small mb-1">مٿي/هيٺ (Y): <span id="customNamePosYVal">130</span>px</label>
                                            <input type="range" class="form-range" id="customNamePosYRange" min="0" max="350" value="130">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 4. Breaking News Banner Settings -->
                        <div class="accordion-item mb-2 border">
                            <h2 class="accordion-header" id="headingBreaking">
                                <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBreaking" aria-expanded="false" aria-controls="collapseBreaking">
                                    <i class="fa fa-bullhorn me-2 text-primary"></i> بريڪنگ نيوز بينر سيٽنگون
                                </button>
                            </h2>
                            <div id="collapseBreaking" class="accordion-collapse collapse" aria-labelledby="headingBreaking" data-bs-parent="#settingsAccordion">
                                <div class="accordion-body bg-light py-2">
                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label class="form-label small mb-1">عنوان جو متن</label>
                                            <input type="text" class="form-control form-control-sm" id="breakingTitleInput" value="برڪنگ نيوز">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small mb-1">پٽي جو رنگ</label>
                                            <input type="color" class="form-control form-control-color form-control-sm w-100" id="topBannerColor" value="#cc0000">
                                        </div>
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label class="form-label small mb-1">فونٽ سائيز: <span id="breakingFontSizeVal">18</span>px</label>
                                            <input type="range" class="form-range" id="breakingFontSizeRange" min="12" max="30" value="18">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small mb-1">اوچائي: <span id="breakingHeightVal">40</span>px</label>
                                            <input type="range" class="form-range" id="breakingHeightRange" min="30" max="70" value="40">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 5. News Text Settings -->
                        <div class="accordion-item mb-2 border">
                            <h2 class="accordion-header" id="headingNewsText">
                                <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNewsText" aria-expanded="false" aria-controls="collapseNewsText">
                                    <i class="fa fa-align-right me-2 text-primary"></i> خبر جو متن ۽ فونٽ سيٽنگون
                                </button>
                            </h2>
                            <div id="collapseNewsText" class="accordion-collapse collapse" aria-labelledby="headingNewsText" data-bs-parent="#settingsAccordion">
                                <div class="accordion-body bg-light py-2">
                                    <div class="mb-2">
                                        <textarea class="form-control form-control-sm" id="newsTextInput" rows="2">رائونتي ۾ موٽر سائڪل سوارن تي مبينه درون حملو، نصير ڪورائي ۽ الله ڏتو ڪورائي زخمي</textarea>
                                    </div>
                                    <div class="row g-2 mb-2">
                                        <div class="col-4">
                                            <label class="form-label small mb-1">سائيز: <span id="fontSizeVal">18</span>px</label>
                                            <input type="range" class="form-range" id="fontSizeRange" min="12" max="30" value="18">
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small mb-1">اوچائي: <span id="barHeightVal">110</span>px</label>
                                            <input type="range" class="form-range" id="barHeightRange" min="70" max="200" value="110">
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small mb-1">رنگ</label>
                                            <input type="color" class="form-control form-control-color form-control-sm w-100" id="bottomBarColor" value="#0d6efd">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="form-label small mb-1">فونٽ جي چونڊ</label>
                                        <select class="form-select form-select-sm" id="fontSelector">
                                            <option value="'Noto Nastaliq Urdu', serif" selected>Noto Nastaliq (نستعليق)</option>
                                            <option value="'Lateef', cursive">Lateef (سنڌي روايتي)</option>
                                            <option value="'Amiri', serif">Amiri (قاعدو)</option>
                                            <option value="'Cairo', sans-serif">Cairo (عام)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 6. Social Icons Settings -->
                        <div class="accordion-item mb-2 border">
                            <h2 class="accordion-header" id="headingSocial">
                                <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSocial" aria-expanded="false" aria-controls="collapseSocial">
                                    <i class="fa fa-share-nodes me-2 text-primary"></i> سماجي رابطن جا آئڪن
                                </button>
                            </h2>
                            <div id="collapseSocial" class="accordion-collapse collapse" aria-labelledby="headingSocial" data-bs-parent="#settingsAccordion">
                                <div class="accordion-body bg-light py-2">
                                    <div class="d-flex gap-3 flex-wrap">
                                        <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-facebook" id="chk-fb" checked><label class="form-check-label small" for="chk-fb">فيس بوڪ</label></div>
                                        <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-instagram" id="chk-insta" checked><label class="form-check-label small" for="chk-insta">انسٽाग्राम</label></div>
                                        <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-whatsapp" id="chk-wa" checked><label class="form-check-label small" for="chk-wa">واٽس اپ</label></div>
                                        <div class="form-check"><input class="form-check-input social-chk" type="checkbox" value="fa-tiktok" id="chk-tt"><label class="form-check-label small" for="chk-tt">ٽڪ تاڪ</label></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Html2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const captureArea = document.getElementById('captureArea');
        const logoInput = document.getElementById('logoInput');
        const logoSizeRange = document.getElementById('logoSizeRange');
        const logoSizeVal = document.getElementById('logoSizeVal');
        const logoPosXRange = document.getElementById('logoPosXRange');
        const logoPosXVal = document.getElementById('logoPosXVal');
        const logoPosYRange = document.getElementById('logoPosYRange');
        const logoPosYVal = document.getElementById('logoPosYVal');
        
        const mainImageInput = document.getElementById('mainImageInput');
        const imgScaleRange = document.getElementById('imgScaleRange');
        const imgScaleVal = document.getElementById('imgScaleVal');
        const imgPosXRange = document.getElementById('imgPosXRange');
        const imgPosXVal = document.getElementById('imgPosXVal');
        const imgPosYRange = document.getElementById('imgPosYRange');
        const imgPosYVal = document.getElementById('imgPosYVal');

        const customNameInput = document.getElementById('customNameInput');
        const customNameSizeRange = document.getElementById('customNameSizeRange');
        const customNameSizeVal = document.getElementById('customNameSizeVal');
        const customNamePosXRange = document.getElementById('customNamePosXRange');
        const customNamePosXVal = document.getElementById('customNamePosXVal');
        const customNamePosYRange = document.getElementById('customNamePosYRange');
        const customNamePosYVal = document.getElementById('customNamePosYVal');

        const breakingTitleInput = document.getElementById('breakingTitleInput');
        const topBannerColor = document.getElementById('topBannerColor');
        const breakingFontSizeRange = document.getElementById('breakingFontSizeRange');
        const breakingFontSizeVal = document.getElementById('breakingFontSizeVal');
        const breakingHeightRange = document.getElementById('breakingHeightRange');
        const breakingHeightVal = document.getElementById('breakingHeightVal');

        const newsTextInput = document.getElementById('newsTextInput');
        const fontSelector = document.getElementById('fontSelector');
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const barHeightRange = document.getElementById('barHeightRange');
        const barHeightVal = document.getElementById('barHeightVal');
        const bottomBarColor = document.getElementById('bottomBarColor');
        
        const prevLogo = document.getElementById('prevLogo');
        const prevCustomName = document.getElementById('prevCustomName');
        const prevTopBanner = document.getElementById('prevTopBanner');
        const prevMainImage = document.getElementById('prevMainImage');
        const prevNewsText = document.getElementById('prevNewsText');
        const prevSocialBar = document.getElementById('prevSocialBar');
        const downloadBtn = document.getElementById('downloadBtn');

        // Logo Controls
        logoSizeRange.addEventListener('input', (e) => {
            logoSizeVal.innerText = e.target.value;
            prevLogo.style.width = e.target.value + 'px';
            prevLogo.style.height = e.target.value + 'px';
        });

        logoPosXRange.addEventListener('input', (e) => {
            logoPosXVal.innerText = e.target.value;
            prevLogo.style.left = e.target.value + 'px';
            prevLogo.style.right = 'auto';
        });

        logoPosYRange.addEventListener('input', (e) => {
            logoPosYVal.innerText = e.target.value;
            prevLogo.style.top = e.target.value + 'px';
        });

        // Custom Name / Watermark Text Controls
        customNameInput.addEventListener('input', (e) => {
            prevCustomName.innerText = e.target.value;
        });

        customNameSizeRange.addEventListener('input', (e) => {
            customNameSizeVal.innerText = e.target.value;
            prevCustomName.style.fontSize = e.target.value + 'px';
        });

        customNamePosXRange.addEventListener('input', (e) => {
            customNamePosXVal.innerText = e.target.value;
            prevCustomName.style.right = e.target.value + 'px';
            prevCustomName.style.left = 'auto';
        });

        customNamePosYRange.addEventListener('input', (e) => {
            customNamePosYVal.innerText = e.target.value;
            prevCustomName.style.bottom = e.target.value + 'px';
        });

        // Main Image Scale & Position Controls
        let currentScale = 1;
        let currentPosX = 0;
        let currentPosY = 0;

        function updateImageTransform() {
            prevMainImage.style.transform = `scale(${currentScale}) translate(${currentPosX}px, ${currentPosY}px)`;
        }

        imgScaleRange.addEventListener('input', (e) => {
            currentScale = e.target.value;
            imgScaleVal.innerText = currentScale;
            updateImageTransform();
        });

        imgPosXRange.addEventListener('input', (e) => {
            currentPosX = e.target.value;
            imgPosXVal.innerText = currentPosX;
            updateImageTransform();
        });

        imgPosYRange.addEventListener('input', (e) => {
            currentPosY = e.target.value;
            imgPosYVal.innerText = currentPosY;
            updateImageTransform();
        });

        // Breaking News Controls
        breakingTitleInput.addEventListener('input', (e) => {
            prevTopBanner.innerText = e.target.value;
        });

        topBannerColor.addEventListener('input', (e) => {
            prevTopBanner.style.backgroundColor = e.target.value;
        });

        breakingFontSizeRange.addEventListener('input', (e) => {
            breakingFontSizeVal.innerText = e.target.value;
            prevTopBanner.style.fontSize = e.target.value + 'px';
        });

        breakingHeightRange.addEventListener('input', (e) => {
            breakingHeightVal.innerText = e.target.value;
            prevTopBanner.style.height = e.target.value + 'px';
        });

        // News Text Controls
        fontSizeRange.addEventListener('input', (e) => {
            fontSizeVal.innerText = e.target.value;
            prevNewsText.style.fontSize = e.target.value + 'px';
        });

        barHeightRange.addEventListener('input', (e) => {
            barHeightVal.innerText = e.target.value;
            prevNewsText.style.height = e.target.value + 'px';
        });

        bottomBarColor.addEventListener('input', (e) => {
            prevNewsText.style.backgroundColor = e.target.value;
        });

        logoInput.addEventListener('change', (e) => {
            if (e.target.files[0]) prevLogo.src = URL.createObjectURL(e.target.files[0]);
        });

        mainImageInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                prevMainImage.src = URL.createObjectURL(e.target.files[0]);
                currentScale = 1;
                currentPosX = 0;
                currentPosY = 0;
                imgScaleRange.value = 1;
                imgScaleVal.innerText = 1;
                imgPosXRange.value = 0;
                imgPosXVal.innerText = 0;
                imgPosYRange.value = 0;
                imgPosYVal.innerText = 0;
                updateImageTransform();
            }
        });

        newsTextInput.addEventListener('input', (e) => {
            prevNewsText.innerText = e.target.value;
        });

        fontSelector.addEventListener('change', (e) => {
            prevNewsText.style.fontFamily = e.target.value;
        });

        document.querySelectorAll('.social-chk').forEach(chk => {
            chk.addEventListener('change', updateSocialIcons);
        });

        function updateSocialIcons() {
            prevSocialBar.innerHTML = '';
            if(document.getElementById('chk-fb').checked) prevSocialBar.innerHTML += '<i class="fab fa-facebook text-primary"></i>';
            if(document.getElementById('chk-insta').checked) prevSocialBar.innerHTML += '<i class="fab fa-instagram text-danger"></i>';
            if(document.getElementById('chk-wa').checked) prevSocialBar.innerHTML += '<i class="fab fa-whatsapp text-success"></i>';
            if(document.getElementById('chk-tt').checked) prevSocialBar.innerHTML += '<i class="fab fa-tiktok text-light"></i>';
        }

        downloadBtn.addEventListener('click', () => {
            downloadBtn.innerText = "ٽيمپليٽ تيار ٿي رهيو آهي...";
            downloadBtn.disabled = true;

            html2canvas(captureArea, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Sindhi-News-Post.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                setTimeout(() => {
                    downloadBtn.innerHTML = '<i class="fa fa-download me-2"></i> تصوير ڊائونلوڊ ڪريو';
                    downloadBtn.disabled = false;
                }, 1000);
            });
        });
    </script>
</body>
</html>
